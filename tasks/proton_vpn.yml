---
# Proton VPN: repositorio oficial (.deb) + app GNOME en amd64.
# https://protonvpn.com/support/linux-ubuntu-vpn-setup/
- name: "[proton] Bloque de instalación"
  block:
    - name: "[proton] App GNOME solo en amd64 (paquetes oficiales)"
      ansible.builtin.debug:
        msg: "Proton VPN (app gráfica): orientada a amd64 en la documentación oficial. En otra arquitectura probá el CLI: https://protonvpn.com/support/linux-cli"
      when: ansible_architecture != "x86_64"

    - name: "[proton] Descargar paquete del repositorio Proton"
      ansible.builtin.get_url:
        url: "{{ protonvpn_release_deb_url }}"
        dest: /tmp/protonvpn-stable-release.deb
        mode: "0644"
      when: ansible_architecture == "x86_64"

    - name: "[proton] Instalar repositorio Proton (claves y sources)"
      ansible.builtin.apt:
        deb: /tmp/protonvpn-stable-release.deb
      become: true
      when: ansible_architecture == "x86_64"

    - name: "[proton] Quitar .deb del repositorio de /tmp"
      ansible.builtin.file:
        path: /tmp/protonvpn-stable-release.deb
        state: absent
      when: ansible_architecture == "x86_64"

    - name: "[proton] Instalar Proton VPN (GNOME)"
      ansible.builtin.apt:
        name: proton-vpn-gnome-desktop
        state: present
        update_cache: true
      become: true
      when: ansible_architecture == "x86_64"

  rescue:
    - name: "[proton] Falló la instalación"
      ansible.builtin.debug:
        msg: "Proton VPN: error — {{ ansible_failed_result.msg | default('revisa red y APT') }}"
  ignore_errors: true
